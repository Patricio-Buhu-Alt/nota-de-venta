services:
  - type: web
    name: nota-bodega
    runtime: node
    plan: free
    rootDir: nota-bodega-app
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: WAREHOUSE_EMAIL
        sync: false
      - key: CC_EMAILS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
